<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal — Andre Erving</title><link rel="stylesheet" href="assets/css/portal.css"><main class="portal-shell"><header class="portal-header"><a href="./">ANDRE ERVING</a><nav><a href="https://www.andreerving.com/courses">Courses</a><button id="signout" hidden>Sign out</button></nav></header><section class="portal-panel"><h1>Customer portal</h1><p>Access your orders, enrolled training, progress, and documents.</p><form id="login"><label>Email address <input id="email" type="email" required autocomplete="email"></label><button type="submit">Email me a sign-in link</button></form><p id="status" role="status" aria-live="polite"></p><div id="dashboard" hidden><h2>Account settings</h2><form id="profile-form"><label>Full name<input id="profile-name" name="full_name" maxlength="160" autocomplete="name"></label><label>Phone<input id="profile-phone" name="phone" maxlength="40" autocomplete="tel"></label><button type="submit">Save profile</button></form><h2>My orders</h2><div id="orders"></div><h2>My courses</h2><div id="enrollments"></div><h2>My documents</h2><div id="documents"></div></div></section></main><script type="module" src="assets/js/portal.js"></script></html>
